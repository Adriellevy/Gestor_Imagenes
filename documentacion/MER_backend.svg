<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 730" font-family="'Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .tbl-name { font: 700 13px 'Segoe UI', sans-serif; fill: #ffffff; }
    .col-name { font: 12px 'Consolas','SF Mono',monospace; fill:#1e293b; }
    .col-type { font: 11px 'Consolas','SF Mono',monospace; fill:#64748b; }
    .pk { fill:#1d4ed8; font-weight:700; }
    .fk { fill:#b45309; font-weight:600; }
    .pkfk { fill:#7c3aed; font-weight:700; }
    .rel-line { stroke:#475569; stroke-width:1.5; fill:none; }
    .rel-dashed { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:5,4; fill:none; }
    .rel-label { font: 700 12px 'Segoe UI',sans-serif; fill:#334155; }
    .rel-note { font: italic 10px 'Segoe UI',sans-serif; fill:#94a3b8; }
  </style>

  <rect x="0" y="0" width="1600" height="730" fill="#f8fafc"/>

  <text x="30" y="28" font-size="18" font-weight="700" fill="#0f172a">MER — Backend Gestor de Imágenes (Suma Care)</text>
  <text x="30" y="46" font-size="12" fill="#64748b">MySQL · TypeORM (synchronize) · tablas con prefijo gi_ (esquema compartido)</text>

  <!-- ===================== gi_usuarios ===================== -->
  <g>
    <rect x="600" y="30" width="260" height="140" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="600" y="30" width="260" height="30" fill="#475569"/>
    <text x="612" y="50" class="tbl-name">gi_usuarios</text>

    <rect x="600" y="60" width="260" height="20" fill="#eff6ff"/>
    <text x="612" y="74" class="col-name pk">id</text>
    <text x="850" y="74" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="600" y="80" width="260" height="20" fill="#ffffff"/>
    <text x="612" y="94" class="col-name">nombre</text>
    <text x="850" y="94" class="col-type" text-anchor="end">varchar(255)</text>

    <rect x="600" y="100" width="260" height="20" fill="#f8fafc"/>
    <text x="612" y="114" class="col-name">rol</text>
    <text x="850" y="114" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="600" y="120" width="260" height="20" fill="#ffffff"/>
    <text x="612" y="134" class="col-name">servicio</text>
    <text x="850" y="134" class="col-type" text-anchor="end">varchar(255)?</text>

    <rect x="600" y="140" width="260" height="20" fill="#f8fafc"/>
    <text x="612" y="154" class="col-name">sectores</text>
    <text x="850" y="154" class="col-type" text-anchor="end">json?</text>
  </g>

  <!-- ===================== gi_pacientes ===================== -->
  <g>
    <rect x="40" y="220" width="260" height="200" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="40" y="220" width="260" height="30" fill="#1e40af"/>
    <text x="52" y="240" class="tbl-name">gi_pacientes</text>

    <rect x="40" y="250" width="260" height="20" fill="#eff6ff"/>
    <text x="52" y="264" class="col-name pk">id</text>
    <text x="290" y="264" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="40" y="270" width="260" height="20" fill="#ffffff"/>
    <text x="52" y="284" class="col-name">hc</text>
    <text x="290" y="284" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="40" y="290" width="260" height="20" fill="#f8fafc"/>
    <text x="52" y="304" class="col-name">documento</text>
    <text x="290" y="304" class="col-type" text-anchor="end">json</text>

    <rect x="40" y="310" width="260" height="20" fill="#ffffff"/>
    <text x="52" y="324" class="col-name">apellido</text>
    <text x="290" y="324" class="col-type" text-anchor="end">varchar(255)</text>

    <rect x="40" y="330" width="260" height="20" fill="#f8fafc"/>
    <text x="52" y="344" class="col-name">nombre</text>
    <text x="290" y="344" class="col-type" text-anchor="end">varchar(255)</text>

    <rect x="40" y="350" width="260" height="20" fill="#ffffff"/>
    <text x="52" y="364" class="col-name">fechaNacimiento</text>
    <text x="290" y="364" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="40" y="370" width="260" height="20" fill="#f8fafc"/>
    <text x="52" y="384" class="col-name">sexo</text>
    <text x="290" y="384" class="col-type" text-anchor="end">varchar(10)</text>

    <rect x="40" y="390" width="260" height="20" fill="#ffffff"/>
    <text x="52" y="404" class="col-name">obraSocial</text>
    <text x="290" y="404" class="col-type" text-anchor="end">varchar(255)?</text>
  </g>

  <!-- ===================== gi_internaciones ===================== -->
  <g>
    <rect x="360" y="220" width="260" height="180" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="360" y="220" width="260" height="30" fill="#0f766e"/>
    <text x="372" y="240" class="tbl-name">gi_internaciones</text>

    <rect x="360" y="250" width="260" height="20" fill="#eff6ff"/>
    <text x="372" y="264" class="col-name pk">id</text>
    <text x="610" y="264" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="360" y="270" width="260" height="20" fill="#fffbeb"/>
    <text x="372" y="284" class="col-name fk">pacienteId</text>
    <text x="610" y="284" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="360" y="290" width="260" height="20" fill="#ffffff"/>
    <text x="372" y="304" class="col-name">servicioId</text>
    <text x="610" y="304" class="col-type" text-anchor="end">varchar(255)</text>

    <rect x="360" y="310" width="260" height="20" fill="#f8fafc"/>
    <text x="372" y="324" class="col-name">ubicacion</text>
    <text x="610" y="324" class="col-type" text-anchor="end">json</text>

    <rect x="360" y="330" width="260" height="20" fill="#ffffff"/>
    <text x="372" y="344" class="col-name">fechaIngreso</text>
    <text x="610" y="344" class="col-type" text-anchor="end">bigint</text>

    <rect x="360" y="350" width="260" height="20" fill="#f8fafc"/>
    <text x="372" y="364" class="col-name">fechaAlta</text>
    <text x="610" y="364" class="col-type" text-anchor="end">bigint?</text>

    <rect x="360" y="370" width="260" height="20" fill="#ffffff"/>
    <text x="372" y="384" class="col-name">estado</text>
    <text x="610" y="384" class="col-type" text-anchor="end">varchar(50)</text>
  </g>

  <!-- ===================== gi_pedidos ===================== -->
  <g>
    <rect x="680" y="220" width="280" height="420" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="680" y="220" width="280" height="30" fill="#6d28d9"/>
    <text x="692" y="240" class="tbl-name">gi_pedidos</text>

    <rect x="680" y="250" width="280" height="20" fill="#eff6ff"/>
    <text x="692" y="264" class="col-name pk">id</text>
    <text x="950" y="264" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="680" y="270" width="280" height="20" fill="#fffbeb"/>
    <text x="692" y="284" class="col-name fk">internacionId</text>
    <text x="950" y="284" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="680" y="290" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="304" class="col-name">servicioSolicitanteId</text>
    <text x="950" y="304" class="col-type" text-anchor="end">varchar(255)</text>

    <rect x="680" y="310" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="324" class="col-name">creadoPor</text>
    <text x="950" y="324" class="col-type" text-anchor="end">varchar(50)?</text>

    <rect x="680" y="330" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="344" class="col-name">tipoTraslado</text>
    <text x="950" y="344" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="680" y="350" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="364" class="col-name">regionAnatomica</text>
    <text x="950" y="364" class="col-type" text-anchor="end">varchar(255)</text>

    <rect x="680" y="370" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="384" class="col-name">lateralidad</text>
    <text x="950" y="384" class="col-type" text-anchor="end">varchar(50)?</text>

    <rect x="680" y="390" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="404" class="col-name">conContraste</text>
    <text x="950" y="404" class="col-type" text-anchor="end">boolean</text>

    <rect x="680" y="410" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="424" class="col-name">prioridad</text>
    <text x="950" y="424" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="680" y="430" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="444" class="col-name">estado</text>
    <text x="950" y="444" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="680" y="450" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="464" class="col-name">motivo</text>
    <text x="950" y="464" class="col-type" text-anchor="end">text</text>

    <rect x="680" y="470" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="484" class="col-name">fechaSolicitud</text>
    <text x="950" y="484" class="col-type" text-anchor="end">bigint</text>

    <rect x="680" y="490" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="504" class="col-name">historial</text>
    <text x="950" y="504" class="col-type" text-anchor="end">json?</text>

    <rect x="680" y="510" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="524" class="col-name">avisoPendiente</text>
    <text x="950" y="524" class="col-type" text-anchor="end">varchar(255)?</text>

    <rect x="680" y="530" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="544" class="col-name">aislamiento</text>
    <text x="950" y="544" class="col-type" text-anchor="end">boolean?</text>

    <rect x="680" y="550" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="564" class="col-name">ordenMedica</text>
    <text x="950" y="564" class="col-type" text-anchor="end">json?</text>

    <rect x="680" y="570" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="584" class="col-name">casoRojo</text>
    <text x="950" y="584" class="col-type" text-anchor="end">varchar(255)?</text>

    <rect x="680" y="590" width="280" height="20" fill="#f8fafc"/>
    <text x="692" y="604" class="col-name">camaGuardia</text>
    <text x="950" y="604" class="col-type" text-anchor="end">varchar(255)?</text>

    <rect x="680" y="610" width="280" height="20" fill="#ffffff"/>
    <text x="692" y="624" class="col-name">emergenciaVista</text>
    <text x="950" y="624" class="col-type" text-anchor="end">json?</text>
  </g>

  <!-- ===================== gi_estudio_solicitado ===================== -->
  <g>
    <rect x="1020" y="220" width="260" height="100" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1020" y="220" width="260" height="30" fill="#b45309"/>
    <text x="1032" y="240" class="tbl-name">gi_estudio_solicitado</text>

    <rect x="1020" y="250" width="260" height="20" fill="#f5f3ff"/>
    <text x="1032" y="264" class="col-name pkfk">pedidoId</text>
    <text x="1270" y="264" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="1020" y="270" width="260" height="20" fill="#fffbeb"/>
    <text x="1032" y="284" class="col-name fk">tipoEstudioId</text>
    <text x="1270" y="284" class="col-type" text-anchor="end">int</text>

    <rect x="1020" y="290" width="260" height="20" fill="#ffffff"/>
    <text x="1032" y="304" class="col-name">descripcion</text>
    <text x="1270" y="304" class="col-type" text-anchor="end">text</text>
  </g>

  <!-- ===================== gi_tipo_estudio ===================== -->
  <g>
    <rect x="1340" y="220" width="220" height="100" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1340" y="220" width="220" height="30" fill="#374151"/>
    <text x="1352" y="240" class="tbl-name">gi_tipo_estudio</text>

    <rect x="1340" y="250" width="220" height="20" fill="#eff6ff"/>
    <text x="1352" y="264" class="col-name pk">id</text>
    <text x="1550" y="264" class="col-type" text-anchor="end">int (AI)</text>

    <rect x="1340" y="270" width="220" height="20" fill="#ffffff"/>
    <text x="1352" y="284" class="col-name">codigo</text>
    <text x="1550" y="284" class="col-type" text-anchor="end">varchar(50)</text>

    <rect x="1340" y="290" width="220" height="20" fill="#f8fafc"/>
    <text x="1352" y="304" class="col-name">tipo</text>
    <text x="1550" y="304" class="col-type" text-anchor="end">varchar(10)</text>
  </g>

  <!-- ===================== Relaciones ===================== -->

  <!-- pacientes 1 -> N internaciones (CASCADE) -->
  <path class="rel-line" d="M300,260 L360,280" marker-end="url(#arrow)"/>
  <text x="305" y="253" class="rel-label">1</text>
  <text x="340" y="298" class="rel-label">N</text>
  <text x="305" y="298" class="rel-note">ON DELETE CASCADE</text>

  <!-- internaciones 1 -> N pedidos (CASCADE) -->
  <path class="rel-line" d="M620,260 L680,280" marker-end="url(#arrow)"/>
  <text x="625" y="253" class="rel-label">1</text>
  <text x="656" y="298" class="rel-label">N</text>
  <text x="625" y="298" class="rel-note">ON DELETE CASCADE</text>

  <!-- pedidos 1 -> 1 estudio_solicitado (CASCADE, PK compartida) -->
  <path class="rel-line" d="M960,260 L1020,260" marker-end="url(#arrow)"/>
  <text x="965" y="253" class="rel-label">1</text>
  <text x="990" y="253" class="rel-label">1</text>
  <text x="962" y="278" class="rel-note">PK compartida · CASCADE</text>

  <!-- estudio_solicitado N -> 1 tipo_estudio (RESTRICT) -->
  <path class="rel-line" d="M1280,280 L1340,260" marker-end="url(#arrow)"/>
  <text x="1284" y="298" class="rel-label">N</text>
  <text x="1315" y="253" class="rel-label">1</text>
  <text x="1284" y="313" class="rel-note">ON DELETE RESTRICT</text>

  <!-- pedidos.creadoPor -> usuarios.id (sin FK declarada) -->
  <path class="rel-dashed" d="M860,70 L980,70 L980,320 L960,320" marker-end="url(#arrow)"/>
  <text x="985" y="200" class="rel-label" transform="rotate(90 985 200)">creadoPor</text>
  <text x="864" y="64" class="rel-note">referencia lógica, sin FK en TypeORM</text>

  <!-- ===================== Leyenda ===================== -->
  <g>
    <rect x="30" y="660" width="1540" height="55" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="46" y="680" class="col-name pk">PK</text>
    <text x="72" y="680" class="col-type">clave primaria</text>

    <text x="200" y="680" class="col-name fk">FK</text>
    <text x="228" y="680" class="col-type">clave foránea</text>

    <text x="360" y="680" class="col-name pkfk">PK/FK</text>
    <text x="410" y="680" class="col-type">PK que también es FK (relación 1:1, clave compartida)</text>

    <text x="46" y="700" class="col-type">?</text>
    <text x="58" y="700" class="col-type">= columna nullable</text>

    <text x="200" y="700" class="col-type">json</text>
    <text x="238" y="700" class="col-type">= columna simple-json de TypeORM</text>

    <line x1="480" y1="696" x2="520" y2="696" class="rel-dashed"/>
    <text x="528" y="700" class="col-type">= relación lógica sin FK real (creadoPor → gi_usuarios.id)</text>
  </g>
</svg>
